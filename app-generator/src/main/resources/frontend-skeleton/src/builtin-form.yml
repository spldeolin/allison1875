namespace: com.allison1875.appgenerator
name: built-form
title: 内置表单

menus:
  - group: 系统
    icon: 1
    order: 1
    form:
      name: User
      title: 用户
      desc: 用户
      items:
        - type: text
          name: username
          title: 用户名
          isNonVoid: true
          maxLength: 32
          canInputOnInit: true
          canInputOnEdit: false

        - type: secret
          name: password
          title: 密码
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: false

        - type: text
          name: nickName
          title: 用户昵称
          isNonVoid: false
          maxLength: 32
          canInputOnInit: true
          canInputOnEdit: true

        - type: time
          name: lastLoginAt
          title: 最后登录时间
          isNonVoid: false
          canInputOnInit: false
          canInputOnEdit: false

        - type: secret
          name: currentToken
          title: 当前登录token
          isNonVoid: false
          canInputOnInit: false
          canInputOnEdit: false
      indices:
        - itemNames: [ username ]
          isUnique: true
        - itemNames: [ currentToken ]
          isUnique: true

  - group: 系统
    icon: 1
    order: 2
    form:
      name: Role
      title: 角色权限
      desc: 角色权限
      items:
        - type: text
          name: roleName
          title: 角色名称
          isNonVoid: true
          maxLength: 32
          canInputOnInit: true
          canInputOnEdit: true

        - type: text
          name: description
          title: 角色描述
          isNonVoid: false
          maxLength: 128
          canInputOnInit: true
          canInputOnEdit: true
      indices:
        - itemNames: [ roleName ]
          isUnique: true

  - group: 系统
    icon: 1
    order: 3
    form:
      name: AuditLog
      title: 审计日志
      items:
        - type: select
          name: operationType
          title: 操作类型
          isNonVoid: true
          canInputOnInit: false
          canInputOnEdit: false
          options:
            - code: dummy1
              title: 占位1
            - code: dummy2
              title: 占位2

        - type: onOff
          name: success
          title: 是否成功
          isNonVoid: true
          canInputOnInit: false
          canInputOnEdit: false

        - type: text
          name: content
          title: 操作内容
          isNonVoid: false
          canInputOnInit: false
          canInputOnEdit: false
          isMultilineOrRich: true

        - type: text
          name: failReason
          title: 失败原因
          isNonVoid: false
          canInputOnInit: false
          canInputOnEdit: false
          maxLength: 512
