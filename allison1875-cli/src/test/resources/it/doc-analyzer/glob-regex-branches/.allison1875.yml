# glob-regex-branches integration test config
# Tests convertGlobToRegex branches with wildcards containing special chars
domains:
  - name: basic
    controllerModule: "."
    controllerPackage: com.example.controller
    dtoModule: "."
    reqDTOPackage: com.example.dto.req
    respDTOPackage: com.example.dto.resp
    enumModule: "."
    enumPackage: com.example.enums
    serviceModule: "."
    servicePackage: com.example.service
    serviceImplModule: "."
    serviceImplPackage: com.example.service.impl
    persistenceModule: "."
    mapperPackage: com.example.mapper
    entityPackage: com.example.entity
    designPackage: com.example.design
    paramDTOPackage: com.example.dto.param
    recordDTOPackage: com.example.dto.record
    wholeDTOPackage: com.example.dto

author: test-author
enableNoModifyAnnounce: true
enableJavaxMoveToJakarta: false
isDataModelWithoutLombok: false

flushTo:
  - MARKDOWN
markdownDir: api-docs
globalUrlPrefix: ""

# Glob patterns using *, ?, {,} (curly-brace alternation) to exercise convertGlobToRegex branches:
# Pattern 1: "*Controller.list*" — uses * wildcard, matches listOrders, listUsers, listProducts
# Pattern 2: "com.example.controller.{Order,User}Controller.get*" — uses {,} alternation and *
# Combined: matches OrderController.listOrders, OrderController.getOrderDetail,
#           UserController.listUsers, UserController.getUserDetail, ProductController.listProducts
mvcHandlerQualifierWildcards:
  - "*Controller.list*"
  - "com.example.controller.{Order,User}Controller.get?rder*"

codeSnippet:
  pageTypeQualifier: com.example.common.PageResult
  constructPageResult: "new PageResult<>(${total}, ${dtos})"
  constructEmptyPageResult: "new PageResult<>()"
