name: Integration Tests

on:
  push:
    branches:
      - '**'
  schedule:
    # 每天 UTC 18:33（即北京时间次日 02:33）触发
    - cron: '33 18 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '8'
            invoker-profile: invoker-it-java8
          - java-version: '17'
            invoker-profile: invoker-it-java17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: |
          chmod +x run-it.sh
          ./run-it.sh ${{ matrix.invoker-profile }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report-java-${{ matrix.java-version }}
          path: allison1875-maven-plugin/target/site/jacoco-aggregate/
          retention-days: 30
