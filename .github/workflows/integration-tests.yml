name: Integration Tests

on:
  push:
    branches:
      - '**'
  schedule:
    # 每天 UTC 18:33（即北京时间次日 02:33）触发
    - cron: '33 18 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: |
          chmod +x run-it.sh
          ./run-it.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: allison1875-maven-plugin/target/site/jacoco-aggregate/
          retention-days: 30
