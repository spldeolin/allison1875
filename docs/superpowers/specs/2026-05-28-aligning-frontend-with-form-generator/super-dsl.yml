# Super DSL for form-generator evidence gathering
# Covers all ItemType variants, canInputOnInit/canInputOnEdit combos, time formats,
# multiSelect, onOff, secret, and composite index
#
# Form 1: StudentProfile
#   Coverage: text (short+regex, short, multiline) + number (integer) + select (canInputOnEdit=false)
#             canInputOnInit/canInputOnEdit variants across items
#
# Form 2: StudentDormitory
#   Coverage: multiSelect + onOff + secret (true+true, false+false) + text (false+true) + number (decimal)
#             composite unique index
#
# Form 3: StudentExam
#   Coverage: time (date / time / dateTime) + select (standard) + number (decimal)
#             composite unique index on 3 fields
#
# Form 4: EmployeeRecord
#   Coverage: 25 items, simulates enterprise HR management with all item types
#             text (short+regex, short, multiline) + number (integer, decimal) + select + multiSelect
#             + onOff + secret + time (date, time, dateTime)
#             demonstrates a real-world high-item-count form with composite unique index

namespace: com.example
name: super-dsl-example
title: 超级DSL示例

menus:
  - group: 学生
    icon: 1
    order: 1
    form:
      name: StudentProfile
      title: 学生档案
      desc: 学生基本档案信息表单
      items:
        # text/short + regex, isNonVoid=true, both patterns=userInput
        - type: text
          name: idCard
          title: 身份证号
          isNonVoid: true
          maxLength: 18
          regex: '^\d{18}$'
          canInputOnInit: true
          canInputOnEdit: true

        # text/short, isNonVoid=true
        - type: text
          name: studentName
          title: 学生姓名
          isNonVoid: true
          maxLength: 50
          canInputOnInit: true
          canInputOnEdit: true

        # text/multiline, isNonVoid=false
        - type: text
          name: bio
          title: 个人简介
          isNonVoid: false
          isMultilineOrRich: true
          maxLength: 2000
          canInputOnInit: true
          canInputOnEdit: true

        # number/integer, isNonVoid=true
        - type: number
          name: age
          title: 年龄
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # select, isNonVoid=true, canInputOnEdit=false (demonstrates readonly-after-create)
        - type: select
          name: gender
          title: 性别
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: false
          options:
            - code: 'M'
              title: 男
            - code: 'F'
              title: 女
      indices:
        - itemNames: [ idCard ]
          isUnique: true

  - group: 学生
    icon: 2
    order: 2
    form:
      name: StudentDormitory
      title: 学生宿舍信息
      desc: 学生宿舍分配与管理表单
      items:
        # number/integer, isNonVoid=true
        - type: number
          name: studentId
          title: 学生ID
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # onOff, isNonVoid=true
        - type: onOff
          name: hasAllergy
          title: 是否有过敏史
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # multiSelect, isNonVoid=false
        - type: multiSelect
          name: facilities
          title: 需要的设施
          isNonVoid: false
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'AC'
              title: 空调
            - code: 'HEATER'
              title: 暖气
            - code: 'DESK'
              title: 书桌

        # secret, canInputOnInit=true, canInputOnEdit=true
        - type: secret
          name: doorPassword
          title: 门禁密码
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # secret, canInputOnInit=false, canInputOnEdit=false (demonstrates false+false combo)
        - type: secret
          name: emergencyContact
          title: 紧急联系人密保
          isNonVoid: true
          canInputOnInit: false
          canInputOnEdit: false

        # text, canInputOnInit=false, canInputOnEdit=true (assignment after creation)
        - type: text
          name: assignedRoom
          title: 分配房间号
          isNonVoid: true
          maxLength: 32
          canInputOnInit: false
          canInputOnEdit: true

        # number/decimal, isNonVoid=true
        - type: number
          name: monthlyRent
          title: 月租金
          isNonVoid: true
          canBeDecimal: true
          canInputOnInit: true
          canInputOnEdit: true
      indices:
        - itemNames: [ studentId ]
          isUnique: true

  - group: 学生
    icon: 3
    order: 3
    form:
      name: StudentExam
      title: 学生考试记录
      desc: 学生考试成绩与时间记录表单
      items:
        # number/integer, isNonVoid=true
        - type: number
          name: studentId
          title: 学生ID
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # select, isNonVoid=true
        - type: select
          name: subject
          title: 考试科目
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'MATH'
              title: 数学
            - code: 'ENG'
              title: 英语

        # number/decimal, isNonVoid=true
        - type: number
          name: score
          title: 考试成绩
          isNonVoid: true
          canBeDecimal: true
          canInputOnInit: true
          canInputOnEdit: true

        # time/date, isNonVoid=true
        - type: time
          name: examDate
          title: 考试日期
          isNonVoid: true
          format: date
          canInputOnInit: true
          canInputOnEdit: true

        # time/time, isNonVoid=true
        - type: time
          name: examTime
          title: 考试时间
          isNonVoid: true
          format: time
          canInputOnInit: true
          canInputOnEdit: true

        # time/dateTime, isNonVoid=true
        - type: time
          name: submittedAt
          title: 提交时间
          isNonVoid: true
          format: dateTime
          canInputOnInit: true
          canInputOnEdit: true
      indices:
        # Composite unique index on 3 fields
        - itemNames: [ studentId, subject, examDate ]
          isUnique: true

  - group: 人事
    icon: 4
    order: 4
    form:
      name: EmployeeRecord
      title: 员工档案
      desc: 企业员工人事档案管理表单，涵盖基本信息、岗位薪资、合同社保等
      items:
        # 1. text/short + regex — 工号
        - type: text
          name: employeeNo
          title: 工号
          isNonVoid: true
          maxLength: 20
          regex: '^EMP\d{6}$'
          canInputOnInit: true
          canInputOnEdit: false

        # 2. text/short — 姓名
        - type: text
          name: fullName
          title: 姓名
          isNonVoid: true
          maxLength: 50
          canInputOnInit: true
          canInputOnEdit: true

        # 3. select — 性别
        - type: select
          name: gender
          title: 性别
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: false
          options:
            - code: 'M'
              title: 男
            - code: 'F'
              title: 女

        # 4. text/short + regex — 身份证号
        - type: text
          name: idCard
          title: 身份证号
          isNonVoid: true
          maxLength: 18
          regex: '^\d{17}[\dXx]$'
          canInputOnInit: true
          canInputOnEdit: false

        # 5. text/short + regex — 手机号
        - type: text
          name: phone
          title: 手机号
          isNonVoid: true
          maxLength: 11
          regex: '^1[3-9]\d{9}$'
          canInputOnInit: true
          canInputOnEdit: true

        # 6. text/short — 邮箱
        - type: text
          name: email
          title: 企业邮箱
          isNonVoid: false
          maxLength: 100
          canInputOnInit: true
          canInputOnEdit: true

        # 7. select — 部门
        - type: select
          name: department
          title: 所属部门
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'TECH'
              title: 技术部
            - code: 'PRODUCT'
              title: 产品部
            - code: 'DESIGN'
              title: 设计部
            - code: 'MARKET'
              title: 市场部
            - code: 'HR'
              title: 人力资源部
            - code: 'FINANCE'
              title: 财务部
            - code: 'ADMIN'
              title: 行政部

        # 8. select — 职级
        - type: select
          name: jobLevel
          title: 职级
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'P1'
              title: 初级
            - code: 'P2'
              title: 中级
            - code: 'P3'
              title: 高级
            - code: 'P4'
              title: 资深
            - code: 'M1'
              title: 主管
            - code: 'M2'
              title: 经理
            - code: 'M3'
              title: 总监

        # 9. text/short — 岗位名称
        - type: text
          name: jobTitle
          title: 岗位名称
          isNonVoid: true
          maxLength: 50
          canInputOnInit: true
          canInputOnEdit: true

        # 10. select — 用工类型
        - type: select
          name: employmentType
          title: 用工类型
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'FULL_TIME'
              title: 正式
            - code: 'CONTRACT'
              title: 合同外包
            - code: 'INTERN'
              title: 实习
            - code: 'PART_TIME'
              title: 兼职

        # 11. time/date — 入职日期
        - type: time
          name: entryDate
          title: 入职日期
          isNonVoid: true
          format: date
          canInputOnInit: true
          canInputOnEdit: false

        # 12. time/date — 试用期结束日期
        - type: time
          name: probationEndDate
          title: 试用期结束日期
          isNonVoid: false
          format: date
          canInputOnInit: true
          canInputOnEdit: true

        # 13. time/date — 合同到期日期
        - type: time
          name: contractExpiry
          title: 合同到期日期
          isNonVoid: false
          format: date
          canInputOnInit: false
          canInputOnEdit: true

        # 14. number/decimal — 基本工资
        - type: number
          name: baseSalary
          title: 基本工资(元)
          isNonVoid: true
          canBeDecimal: true
          canInputOnInit: true
          canInputOnEdit: true

        # 15. number/decimal — 绩效奖金系数
        - type: number
          name: bonusCoefficient
          title: 绩效奖金系数
          isNonVoid: false
          canBeDecimal: true
          canInputOnInit: false
          canInputOnEdit: true

        # 16. secret — 银行卡号
        - type: secret
          name: bankAccount
          title: 工资卡号
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # 17. secret — 社保账号
        - type: secret
          name: socialSecurityNo
          title: 社保账号
          isNonVoid: false
          canInputOnInit: false
          canInputOnEdit: true

        # 18. select — 学历
        - type: select
          name: education
          title: 最高学历
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'HIGH_SCHOOL'
              title: 高中/中专
            - code: 'COLLEGE'
              title: 大专
            - code: 'BACHELOR'
              title: 本科
            - code: 'MASTER'
              title: 硕士
            - code: 'DOCTOR'
              title: 博士

        # 19. multiSelect — 持有证书
        - type: multiSelect
          name: certifications
          title: 持有证书
          isNonVoid: false
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'PMP'
              title: PMP项目管理
            - code: 'CPA'
              title: 注册会计师
            - code: 'AWS_SA'
              title: AWS解决方案架构师
            - code: 'SOFT_ENG'
              title: 软件工程师(中级)
            - code: 'INFO_SEC'
              title: 信息安全工程师
            - code: 'LEGAL'
              title: 法律职业资格

        # 20. multiSelect — 擅长技能
        - type: multiSelect
          name: skills
          title: 擅长技能
          isNonVoid: false
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'JAVA'
              title: Java
            - code: 'PYTHON'
              title: Python
            - code: 'FRONTEND'
              title: 前端开发
            - code: 'DATA'
              title: 数据分析
            - code: 'DESIGN'
              title: UI设计
            - code: 'PM'
              title: 项目管理
            - code: 'OPS'
              title: 运维

        # 21. onOff — 是否在职
        - type: onOff
          name: isActive
          title: 是否在职
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # 22. onOff — 是否已签竞业协议
        - type: onOff
          name: hasNonCompete
          title: 已签竞业协议
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: false

        # 23. text/short — 紧急联系人
        - type: text
          name: emergencyContact
          title: 紧急联系人
          isNonVoid: true
          maxLength: 50
          canInputOnInit: true
          canInputOnEdit: true

        # 24. text/short + regex — 紧急联系人电话
        - type: text
          name: emergencyPhone
          title: 紧急联系人电话
          isNonVoid: true
          maxLength: 11
          regex: '^1[3-9]\d{9}$'
          canInputOnInit: true
          canInputOnEdit: true

        # 25. text/short — 工位编号
        - type: text
          name: workStation
          title: 工位编号
          isNonVoid: false
          maxLength: 20
          canInputOnInit: false
          canInputOnEdit: true

        # 26. text/multiline — 备注
        - type: text
          name: remark
          title: 备注
          isNonVoid: false
          isMultilineOrRich: true
          maxLength: 2000
          canInputOnInit: true
          canInputOnEdit: true

        # 27. number/integer — 年假天数
        - type: number
          name: annualLeaveDays
          title: 年假天数
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: false
          canInputOnEdit: true

        # 28. time/dateTime — 最近绩效评估时间
        - type: time
          name: lastReviewAt
          title: 最近绩效评估时间
          isNonVoid: false
          format: dateTime
          canInputOnInit: false
          canInputOnEdit: true

        # 29. time/time — 上班打卡时间
        - type: time
          name: checkInTime
          title: 规定上班时间
          isNonVoid: false
          format: time
          canInputOnInit: false
          canInputOnEdit: true

      indices:
        - itemNames: [ employeeNo ]
          isUnique: true
        - itemNames: [ idCard ]
          isUnique: true
