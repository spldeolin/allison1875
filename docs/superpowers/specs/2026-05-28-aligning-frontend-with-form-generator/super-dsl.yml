# Super DSL for form-generator evidence gathering
# Covers all ItemType variants, canInputOnInit/canInputOnEdit combos, time formats,
# multiSelect, onOff, secret, and composite index
#
# Form 1: StudentProfile
#   Coverage: text (short+regex, short, multiline) + number (integer) + select (canInputOnEdit=false)
#             canInputOnInit/canInputOnEdit variants across items
#
# Form 2: StudentDormitory
#   Coverage: multiSelect + onOff + secret (true+true, false+false) + text (false+true) + number (decimal)
#             composite unique index
#
# Form 3: StudentExam
#   Coverage: time (date / time / dateTime) + select (standard) + number (decimal)
#             composite unique index on 3 fields

namespace: com.example
name: super-dsl-example
title: 超级DSL示例

menus:
  - group: 学生
    icon: 1
    order: 1
    form:
      name: StudentProfile
      title: 学生档案
      desc: 学生基本档案信息表单
      items:
        # text/short + regex, isNonVoid=true, both patterns=userInput
        - type: text
          name: idCard
          title: 身份证号
          isNonVoid: true
          maxLength: 18
          regex: '^\d{18}$'
          canInputOnInit: true
          canInputOnEdit: true

        # text/short, isNonVoid=true
        - type: text
          name: studentName
          title: 学生姓名
          isNonVoid: true
          maxLength: 50
          canInputOnInit: true
          canInputOnEdit: true

        # text/multiline, isNonVoid=false
        - type: text
          name: bio
          title: 个人简介
          isNonVoid: false
          isMultilineOrRich: true
          maxLength: 2000
          canInputOnInit: true
          canInputOnEdit: true

        # number/integer, isNonVoid=true
        - type: number
          name: age
          title: 年龄
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # select, isNonVoid=true, canInputOnEdit=false (demonstrates readonly-after-create)
        - type: select
          name: gender
          title: 性别
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: false
          options:
            - code: 'M'
              title: 男
            - code: 'F'
              title: 女
      indices:
        - itemNames: [ idCard ]
          isUnique: true

  - group: 学生
    icon: 2
    order: 2
    form:
      name: StudentDormitory
      title: 学生宿舍信息
      desc: 学生宿舍分配与管理表单
      items:
        # number/integer, isNonVoid=true
        - type: number
          name: studentId
          title: 学生ID
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # onOff, isNonVoid=true
        - type: onOff
          name: hasAllergy
          title: 是否有过敏史
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # multiSelect, isNonVoid=false
        - type: multiSelect
          name: facilities
          title: 需要的设施
          isNonVoid: false
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'AC'
              title: 空调
            - code: 'HEATER'
              title: 暖气
            - code: 'DESK'
              title: 书桌

        # secret, canInputOnInit=true, canInputOnEdit=true
        - type: secret
          name: doorPassword
          title: 门禁密码
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true

        # secret, canInputOnInit=false, canInputOnEdit=false (demonstrates false+false combo)
        - type: secret
          name: emergencyContact
          title: 紧急联系人密保
          isNonVoid: true
          canInputOnInit: false
          canInputOnEdit: false

        # text, canInputOnInit=false, canInputOnEdit=true (assignment after creation)
        - type: text
          name: assignedRoom
          title: 分配房间号
          isNonVoid: true
          maxLength: 32
          canInputOnInit: false
          canInputOnEdit: true

        # number/decimal, isNonVoid=true
        - type: number
          name: monthlyRent
          title: 月租金
          isNonVoid: true
          canBeDecimal: true
          canInputOnInit: true
          canInputOnEdit: true
      indices:
        - itemNames: [ studentId ]
          isUnique: true

  - group: 学生
    icon: 3
    order: 3
    form:
      name: StudentExam
      title: 学生考试记录
      desc: 学生考试成绩与时间记录表单
      items:
        # number/integer, isNonVoid=true
        - type: number
          name: studentId
          title: 学生ID
          isNonVoid: true
          canBeDecimal: false
          canInputOnInit: true
          canInputOnEdit: true

        # select, isNonVoid=true
        - type: select
          name: subject
          title: 考试科目
          isNonVoid: true
          canInputOnInit: true
          canInputOnEdit: true
          options:
            - code: 'MATH'
              title: 数学
            - code: 'ENG'
              title: 英语

        # number/decimal, isNonVoid=true
        - type: number
          name: score
          title: 考试成绩
          isNonVoid: true
          canBeDecimal: true
          canInputOnInit: true
          canInputOnEdit: true

        # time/date, isNonVoid=true
        - type: time
          name: examDate
          title: 考试日期
          isNonVoid: true
          format: date
          canInputOnInit: true
          canInputOnEdit: true

        # time/time, isNonVoid=true
        - type: time
          name: examTime
          title: 考试时间
          isNonVoid: true
          format: time
          canInputOnInit: true
          canInputOnEdit: true

        # time/dateTime, isNonVoid=true
        - type: time
          name: submittedAt
          title: 提交时间
          isNonVoid: true
          format: dateTime
          canInputOnInit: true
          canInputOnEdit: true
      indices:
        # Composite unique index on 3 fields
        - itemNames: [ studentId, subject, examDate ]
          isUnique: true
